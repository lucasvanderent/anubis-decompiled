name: Build
on:
  push:
    branches:
      - remove-custom-account-management
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build mod
        run: bash ./gradlew --no-daemon build
      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: anubis-cleaned-client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
